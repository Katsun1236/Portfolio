<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>B-Impact Admin | CMS</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: #EEEAE0;
            color: #17130F;
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        header {
            padding: 24px;
            border-bottom: 1px solid rgba(23, 19, 15, 0.16);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-family: 'Archivo', sans-serif;
            font-weight: 800;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 0;
        }
        header a {
            color: rgba(23, 19, 15, 0.6);
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
        }
        header a:hover { color: #17130F; }
        #nc-root { max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <header>
        <h1>B-Impact Admin</h1>
        <a href="/">Retour au site</a>
    </header>

    <div id="nc-root"></div>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function (user) {
                if (!user) {
                    window.netlifyIdentity.on("login", function () {
                        document.location.href = "/admin/";
                    });
                }
            });
        }

        CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500&display=swap", { raw: false });
        CMS.registerPreviewStyle(`
            body {
                background-color: #EEEAE0;
                color: #17130F;
                font-family: 'Inter', sans-serif;
                padding: 2rem;
            }
            h1, h2, h3 { font-family: 'Archivo', sans-serif; font-weight: 800; text-transform: uppercase; }
            .preview-container { max-width: 800px; margin: auto; }
            .title-preview { font-size: 2.5rem; margin-bottom: 1rem; }
            .desc-preview { font-size: 1.1rem; color: rgba(23, 19, 15, 0.62); margin-bottom: 1.5rem; }
        `, { raw: true });

        var PagePreview = createClass({
            render: function () {
                var entry = this.props.entry;
                return h('div', { className: "preview-container" },
                    h('h1', { className: "title-preview" }, entry.getIn(['data', 'hero_title'])),
                    h('p', { className: "desc-preview" }, entry.getIn(['data', 'hero_desc'])),
                    entry.getIn(['data', 'para_1']) ? h('p', { className: "desc-preview" }, entry.getIn(['data', 'para_1'])) : null,
                    entry.getIn(['data', 'para_2']) ? h('p', { className: "desc-preview" }, entry.getIn(['data', 'para_2'])) : null
                );
            }
        });

        CMS.registerPreviewTemplate("pages", PagePreview);
    </script>
</body>
</html>
