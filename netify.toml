
X-Content-Type-Options = "nosniff"

X-XSS-Protection = "1; mode=block"

Referrer-Policy = "strict-origin-when-cross-origin"

Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self';"
